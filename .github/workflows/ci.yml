name: CI

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  default:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        smalltalk: [ Pharo64-12, Pharo64-13, Pharo64-14, Pharo64-15 ]
    name: ${{ matrix.smalltalk }}
    steps:
      - uses: actions/checkout@v7
      - uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: ${{ matrix.smalltalk }}
      - name: Load and test the Pharo backend and the tools, with no PCRE2 installed
        run: smalltalkci -s ${{ matrix.smalltalk }}
        shell: bash
        timeout-minutes: 15
      - name: Coveralls
        if: ${{ success() && matrix.smalltalk == 'Pharo64-14' }}
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ./coverage/lcov.info
          format: lcov
          flag-name: Pharo64-14
          fail-on-error: false

  ffi-only:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        smalltalk: [ Pharo64-12, Pharo64-13, Pharo64-14, Pharo64-15 ]
    name: ${{ matrix.smalltalk }} FFI only
    steps:
      - uses: actions/checkout@v7
      - name: Install PCRE2
        run: sudo apt-get update && sudo apt-get install -y libpcre2-dev
      - uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: ${{ matrix.smalltalk }}
      - name: Load and test the FFI backend without the Pharo one
        run: smalltalkci -s ${{ matrix.smalltalk }} .smalltalk-ffi.ston
        shell: bash
        timeout-minutes: 15

  with-c-library:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        smalltalk: [ Pharo64-12, Pharo64-13, Pharo64-14, Pharo64-15 ]
    name: ${{ matrix.smalltalk }} with the C library
    steps:
      - uses: actions/checkout@v7
      - name: Install PCRE2
        run: sudo apt-get update && sudo apt-get install -y libpcre2-dev
      - uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: ${{ matrix.smalltalk }}
      - name: Load and test every group, both backends and the tools
        run: smalltalkci -s ${{ matrix.smalltalk }} .smalltalk-lib.ston
        shell: bash
        timeout-minutes: 15
